services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indexbeef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indexbeef}
      POSTGRES_DB: ${POSTGRES_DB:-indexbeef}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indexbeef}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-indexbeef}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-indexbeef-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-indexbeef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indexbeef}
      POSTGRES_DB: ${POSTGRES_DB:-indexbeef}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-indexbeef}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-indexbeef-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-indexbeef}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-indexbeef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indexbeef}
      POSTGRES_DB: ${POSTGRES_DB:-indexbeef}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-indexbeef}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-indexbeef-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-indexbeef}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app
    command: rq worker --url redis://redis:6379 indexbeef

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data:
  minio_data:
