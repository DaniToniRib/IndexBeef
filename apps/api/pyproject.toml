[project]
name = "indexbeef-api"
version = "0.1.0"
description = "IndexBeef — API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "rq>=1.16",
  "boto3>=1.34",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: `class X(str, Enum)` -> `class X(StrEnum)`. StrEnum muda __str__ e pode
# afetar logs/SQLAlchemy; mantemos o padrao antigo que ja esta validado por testes.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends/Query/Path/Body/Header/Cookie sao chamados em defaults
# propositalmente — e o padrao idiomatico do FastAPI (B008 nao se aplica).
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
]
