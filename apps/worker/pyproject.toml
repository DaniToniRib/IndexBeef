[project]
name = "indexbeef-worker"
version = "0.1.0"
description = "IndexBeef — Worker de visão computacional"
requires-python = ">=3.11"
dependencies = [
  "rq>=1.16",
  "redis>=5.0",
  "numpy>=1.26",
  "opencv-contrib-python-headless>=4.10",
  "pillow>=10.3",
  "pydantic>=2.7",
  "boto3>=1.34",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

ml = [
  "ultralytics>=8.2",
  "torch>=2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["indexbeef_vision*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ml: integracao com modelos de ML (requer extra [ml] instalado)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
