name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install api
        run: |
          pip install --upgrade pip
          pip install .[dev]
      - name: Install worker (indexbeef_vision é importado pelos endpoints)
        run: pip install -e ../worker
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  worker:
    name: Worker (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install .[dev]
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
